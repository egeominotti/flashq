[package]
name = "flashq"
version = "0.4.0"
edition = "2021"
description = "High-performance Rust client for flashQ job queue"
license = "MIT"
repository = "https://github.com/egeominotti/flashq"
keywords = ["queue", "job", "async", "worker"]
categories = ["asynchronous", "network-programming"]

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
thiserror = "2"
dashmap = "6"
regex = "1"
once_cell = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = "0.3"

[[example]]
name = "01_basic"
path = "examples/01_basic.rs"

